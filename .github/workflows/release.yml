name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 5.18.0)'
        required: true
        type: string
      tag:
        description: 'hev-socks5-tunnel tag to build (e.g. 2.18.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build xcframework
        run: scripts/build.sh "${{ inputs.tag }}"

      - name: Render Package.swift
        run: |
          CHECKSUM=$(shasum -a 256 HevSocks5Tunnel.xcframework.zip | cut -c1-64)
          sed -e "s#REPOSITORY#${{ github.repository }}#g" \
              -e "s#VERSION#${{ inputs.version }}#g" \
              -e "s#CHECKSUM#${CHECKSUM}#g" \
              Templates/Package.template > Package.swift
          cat Package.swift

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "Tun2SocksKit Release ${{ inputs.version }} (hev-socks5-tunnel ${{ inputs.tag }})"
          git tag -a "${{ inputs.version }}" -m "${{ inputs.version }}"
          git push origin HEAD "${{ inputs.version }}"

      - name: Upload Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" HevSocks5Tunnel.xcframework.zip \
            --title "${{ inputs.version }}" \
            --notes "Compiled from source tag: ${{ inputs.tag }} (ENABLE_STACK_OVERFLOW_DETECTOR=0)"
